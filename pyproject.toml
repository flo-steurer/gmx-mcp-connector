[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "awita-mail-mcp"
version = "0.1.0"
description = "Authenticated, draft-first MCP server for a GMX business mailbox"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "certifi==2026.7.22",
  "mcp==2.2.0",
  "pydantic==2.12.5",
  "starlette==0.48.0",
  "uvicorn==0.37.0",
]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.2",
]

[project.scripts]
awita-mail = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]
